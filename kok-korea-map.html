<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>콕! 대한민국 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* iOS 앱 느낌: 지도 위로 올라오는 둥근 시트, 묶음 목록, 시스템 글꼴, 밝은 지도 색 */
:root{--sea:#a9dcf5;--seatxt:#3d8fc0;--nb:#eef0ec;--l1:#ffe48a;--l2:#b9eaa4;--l3:#ffc9a1;--l4:#d6ccf8;--edge:#ffffff;
--sheet:#f2f2f7;--card:#ffffff;--ink:#1c1c1e;--mute:#6c6c70;--line:#e3e3e8;--blue:#007aff;--onblue:#ffffff;--tint:#e1efff;--good:#34c759;--goodtxt:#1a8f3c;--bad:#ff3b30;--badtxt:#d92c22;--halo:#ffffff;--shadow:rgba(30,50,80,.18);
--i1:#ff9500;--i2:#34c759;--i3:#af52de;
--body:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sea:#14364d;--seatxt:#6fb4dc;--nb:#2a2d30;--l1:#8a7630;--l2:#47803f;--l3:#99623a;--l4:#67589f;--edge:#10161b;--sheet:#000000;--card:#1c1c1e;--ink:#ffffff;--mute:#a1a1a8;--line:#38383a;--blue:#0a84ff;--onblue:#ffffff;--tint:#10304f;--good:#30d158;--goodtxt:#30d158;--bad:#ff453a;--badtxt:#ff6961;--halo:#10161b;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--sea:#14364d;--seatxt:#6fb4dc;--nb:#2a2d30;--l1:#8a7630;--l2:#47803f;--l3:#99623a;--l4:#67589f;--edge:#10161b;--sheet:#000000;--card:#1c1c1e;--ink:#ffffff;--mute:#a1a1a8;--line:#38383a;--blue:#0a84ff;--onblue:#ffffff;--tint:#10304f;--good:#30d158;--goodtxt:#30d158;--bad:#ff453a;--badtxt:#ff6961;--halo:#10161b;--shadow:rgba(0,0,0,.5);color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:17px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
#mapwrap{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--sea)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;display:block}
#panel{position:relative;margin-top:-20px;background:var(--sheet);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px var(--shadow);padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:64%;overflow-y:auto}
#panel>*{flex:none}
@media (min-width:860px){#app{flex-direction:row-reverse}#panel{width:380px;margin:16px 0 16px 16px;border-radius:24px;max-height:none;box-shadow:0 8px 32px var(--shadow);padding-inline:20px}}
h1{font-size:clamp(30px,8.5vw,34px);font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance}
.brand{display:flex;align-items:center;gap:10px}
.appic{flex:none;width:42px;height:42px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center}
.appic svg{width:27px;height:27px}
.foot{align-self:center;min-height:30px;padding-inline:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.about{padding:22px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:3px}
.about .appic{width:60px;height:60px;border-radius:14px;margin-bottom:8px}.about .appic svg{width:38px;height:38px}
.about h3{padding:0;font-size:19px}
.about p{padding:0;font-size:14px}
.about dl{width:100%;margin:12px 0 0;text-align:left;font-size:14px}
.about dl div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.about dt{color:var(--mute)}.about dd{margin:0;font-weight:600}
.about .src{margin-top:8px;text-align:left;padding:0;font-size:11.5px}
.closeb{width:100%;min-height:50px;font-size:17px;font-weight:600;color:var(--blue);box-shadow:inset 0 1px 0 var(--line)}
h1 em{font-style:normal;color:var(--blue)}
p{margin:0;line-height:1.45}
.sub{color:var(--mute);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;transition:transform .12s ease,opacity .12s ease}
button:active{transform:scale(.97);opacity:.85}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px;background:var(--line);border-radius:10px}
.seg button{min-height:40px;border-radius:8px;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:700;box-shadow:0 1px 4px var(--shadow)}
.seglab{font-size:14px;font-weight:600;color:var(--mute);display:flex;justify-content:space-between;gap:8px;margin-bottom:-6px}
.seglab span{font-weight:400}
.modes{background:var(--card);border-radius:16px;overflow:hidden}
.mode{width:100%;text-align:left;padding:11px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.mode:active{transform:none;background:var(--line);opacity:1}
.mode+.mode{box-shadow:inset 0 1px 0 var(--line)}
.ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-region{background:var(--i1)}.ic-easy{background:var(--i2)}.ic-normal{background:var(--i3)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mode b{font-size:17px;font-weight:700}
.mode small{font-size:14px;color:var(--mute);line-height:1.3}
.mode i{font-style:normal;font-size:13px;color:var(--blue);font-variant-numeric:tabular-nums}
.chev{flex:none;width:9px;height:15px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.top b{color:var(--ink);font-weight:600}
.score{background:var(--card);border-radius:999px;padding:3px 12px}
.quit{flex:none;min-height:34px;padding-inline:13px;border-radius:999px;background:var(--card);color:var(--badtxt);font-size:15px;font-weight:600}
.top .where{flex:1;min-width:0}
.alert{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.4);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.alert[hidden]{display:none}
.alertbox{width:min(300px,100%);background:var(--card);border-radius:18px;overflow:hidden;text-align:center;box-shadow:0 10px 40px var(--shadow)}
.alertbox h3{margin:0;padding:20px 16px 4px;font-size:18px;font-weight:700}
.alertbox p{padding:0 16px 18px;font-size:15px;color:var(--mute)}
.alertbtns{display:grid;grid-template-columns:1fr 1fr;box-shadow:inset 0 1px 0 var(--line)}
.alertbtns button{min-height:50px;font-size:17px;color:var(--blue)}
.alertbtns button:first-child{font-weight:600;box-shadow:inset -1px 0 0 var(--line)}
.alertbtns button:last-child{color:var(--badtxt)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .25s ease}
.ask{font-size:clamp(36px,10.5vw,44px);font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.ask.long{font-size:clamp(27px,7.6vw,32px)}
.result{min-height:1.5em;line-height:1.4;font-size:17px}
.result strong{font-size:20px;font-weight:700}
.ok{color:var(--goodtxt)}.no{color:var(--badtxt)}
.go{width:100%;min-height:52px;background:var(--blue);color:var(--onblue);border-radius:14px;font-size:18px;font-weight:600}
.ghost{flex:0 0 auto;min-height:48px;background:var(--tint);color:var(--blue);border-radius:14px;padding-inline:14px;font-size:17px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .ghost{flex:1 1 auto}.row .go{width:auto}
.total{font-size:clamp(46px,13vw,60px);font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--blue);font-variant-numeric:tabular-nums}
.total small{font-size:.36em;font-weight:500;color:var(--mute);letter-spacing:0}
#log{list-style:none;margin:0;padding:0 14px;background:var(--card);border-radius:16px;font-variant-numeric:tabular-nums;font-size:16px}
#log li{display:grid;grid-template-columns:1fr auto 3em;gap:10px;padding:10px 0}
#log li+li{border-top:1px solid var(--line)}
#log span:nth-child(2){color:var(--mute)}#log span:last-child{text-align:right;font-weight:600}
.src{font-size:12px;color:var(--mute);line-height:1.45}
.zoom{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;border-radius:14px;background:var(--card);box-shadow:0 2px 12px var(--shadow);overflow:hidden}
.zoom button{width:46px;height:46px;font-size:24px;line-height:1;color:var(--blue)}
.zoom button+button{box-shadow:inset 0 1px 0 var(--line)}
.scale{background:var(--card);box-shadow:0 1px 6px var(--shadow);padding:4px 9px 6px;border-radius:9px;position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:32px;font-size:12px;font-weight:500;color:var(--ink);pointer-events:none;font-variant-numeric:tabular-nums}
.scale div{border:2px solid var(--ink);border-top:0;height:5px;margin-top:2px;border-radius:0 0 2px 2px}
@media (min-width:860px){.scale{bottom:14px}}
/* 지도 요소 */
#grat{display:none}
.nb{fill:var(--nb);stroke:none}
.rg{stroke:var(--edge);stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .2s,opacity .2s}
.c1{fill:var(--l1)}.c2{fill:var(--l2)}.c3{fill:var(--l3)}.c4{fill:var(--l4)}
.rg.right{fill:var(--good)}.rg.wrong{fill:var(--bad)}.rg.dim{opacity:.25}
.mu{stroke-width:.6px}
.ol{fill:none;stroke:var(--edge);stroke-width:2.2px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
text{pointer-events:none;font-family:var(--body)}
.sea{fill:var(--seatxt);font-weight:600;letter-spacing:.3em}
.lab{fill:var(--ink);font-weight:600;text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round}
.ans{pointer-events:none}
.a1{fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}.a2{fill:var(--blue)}
.alab{fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:4;stroke-linejoin:round;text-anchor:middle}
@media (prefers-reduced-motion:no-preference){.result strong{display:inline-block;animation:pop .32s cubic-bezier(.3,1.5,.6,1)}@keyframes pop{from{transform:scale(.8);opacity:0}}}
</style>
</head>

<div id="app">
  <div id="mapwrap">
    <svg id="map" role="application" aria-label="남한 지도. 위치를 눌러 답하세요."><g id="grat"></g><g id="nbs"></g><g id="seas"></g><g id="rgs"></g><g id="mus" style="display:none"></g><g id="ols" style="display:none"></g><g id="labs"></g><g id="marks"></g></svg>

function zoomAt(f,px,py){const b=toMap(px,py);v.k*=f;clampV();const a=toMap(px,py);v.cx+=b.x-a.x;v.cy+=b.y-a.y;applyView()}
function toMap(px,py){return{x:v.cx+(px-W/2)*v.k,y:v.cy+(py-H/2)*v.k}}
new ResizeObserver(()=>{const was=v.k===base;measure();if(was)v.k=base;applyView()}).observe(wrap);
$('#zin').onclick=()=>zoomAt(.6,W/2,H/2);$('#zout').onclick=()=>zoomAt(1/.6,W/2,H/2);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?.85:1/.85,e.clientX-r.left,e.clientY-r.top)},{passive:false});
const pts=new Map();let moved=false,pinch=0;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});if(pts.size===1)moved=false;else moved=true;pinch=0});
svg.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(pts.size===1){if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>7)moved=true;if(moved){v.cx-=dx*v.k;v.cy-=dy*v.k;applyView()}}
  p.x=e.clientX;p.y=e.clientY;
  if(pts.size===2){const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const r=svg.getBoundingClientRect();if(pinch)zoomAt(pinch/d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch=d}});
function up(e){const had=pts.delete(e.pointerId);pinch=0;if(had&&!moved&&e.type==='pointerup'&&pts.size===0){const r=svg.getBoundingClientRect();onTap(e.clientX-r.left,e.clientY-r.top,e.clientX,e.clientY)}}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);

/* 표식 */
function pinned(x,y,parts,cls=''){const g=el('g',{class:cls});g.dataset.pinned=1;g.dataset.x=x;g.dataset.y=y;parts.forEach(p=>g.appendChild(p));$('#marks').appendChild(g);g.setAttribute('transform',`translate(${x} ${y}) scale(${v.k})`);return g}
const guessMark=(x,y)=>pinned(x,y,[el('circle',{r:8,class:'pinc'})],'pin');
function answerMark(x,y,name,small){const parts=[el('circle',{r:small?5:9,class:'a1'}),el('circle',{r:small?2:4,class:'a2'})];if(name){parts.push(el('text',{y:-14,class:'alab','font-size':16},name))}return pinned(x,y,parts,'ans')}
const clearMarks=()=>$('#marks').replaceChildren();
function linkLine(a,b){$('#marks').appendChild(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'link'}))}
function clearRegions(){[...Object.values(paths),...muPaths].forEach(p=>p.classList.remove('right','wrong','dim'))}

/* 게임 */
let S=null,tapHandler=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function scoreFor(d){return Math.max(0,Math.round(100*(1-Math.max(0,d-5)/145)))}
function onTap(px,py,cx,cy){if(tapHandler)tapHandler(px,py,cx,cy)}

function home(){S=null;tapHandler=null;clearMarks();clearRegions();setLevel(false);showLabels(true);renderHome();fitLand()}
function renderHome(){
  panel.innerHTML=`<div class="brand"><span class="appic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.500s7.500-6.600 7.500-12A7.500 7.500 0 0 0 4.500 9.500c0 5.400 7.500 12 7.500 12z" fill="currentColor"/><circle cx="12" cy="9.500" r="2.800" fill="var(--blue)"/></svg></span><h1>콕! <em>대한민국</em> 지도</h1></div><p class="sub">문제를 읽고 지도에서 맞는 곳을 콕 눌러 보세요. 모르겠으면 힌트를 쓰면 돼요.</p>
  <div class="seglab">문제 수${COUNT===20?'<span>시·도 찾기는 16문제까지</span>':''}</div>
  <div class="seg" role="group" aria-label="문제 수">${[5,10,15,20].map(n=>`<button id="n-${n}" data-n="${n}" aria-pressed="${n===COUNT}">${n}문제</button>`).join('')}</div>
  <div class="modes">${Object.entries(MODES).map(([k,m])=>`<button class="mode" id="m-${k}" data-m="${k}"><span class="ic ic-${k}">${ICONS[k]}</span><span class="tx"><b>${m.t}</b><small>${m.d}</small>${best(k)?`<i>최고 ${best(k)}점</i>`:''}</span><svg class="chev" viewBox="0 0 9 15" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5 1.5 13.5"/></svg></button>`).join('')}</div>
  <button class="foot" id="info">© 2026 CHO · 버전 1.0 · 앱 정보</button>`;
  panel.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
  panel.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{COUNT=+b.dataset.n;try{localStorage.setItem('kok-count',COUNT)}catch{}renderHome();$('#n-'+COUNT).focus({preventScroll:true})})}

function start(mode){let q;
  if(mode==='region')q=shuffle(Object.keys(DATA.regions)).slice(0,realCount(mode)).map(c=>({code:c,name:DATA.regions[c].name,region:true}));
  else q=shuffle(DATA.cities.filter(c=>MODES[mode].lv.includes(c[4]))).slice(0,realCount(mode)).map(c=>({name:c[0],x:c[1],y:c[2],code:c[3],mu:c[5]}));
  S={mode,q,n:q.length,i:0,total:0,log:[]};nextRound()}

function head(){return `<div class="top"><button class="quit" id="quit">종료</button><span class="where">${MODES[S.mode].t} · <b>${S.i+1}/${S.n}</b></span><span class="score"><b>${S.total}</b>점</span></div><div class="prog"><i style="width:${(S.i+1)/S.n*100}%"></i></div>`}
function nextRound(){clearMarks();clearRegions();setLevel(S.mode!=='region');showLabels(false);S.mode==='region'?playRound():cityRound();fitLand()}

function playRound(){const q=S.q[S.i],T=DATA.regions[q.code];let hinted=false;
  const title=`<h2 class="ask ${q.name.length>6?'long':''}">${q.name}</h2>`;
  panel.innerHTML=head()+title+`<p class="result" id="res">${q.region?'이 지역을 지도에서 눌러 보세요.':'이 도시가 있는 시·도를 눌러 보세요.'}</p><button class="ghost" id="hint">힌트 보기 (맞히면 50점)</button>`;
  const ask=$('#res').textContent,others=shuffle(Object.keys(paths).filter(c=>c!==q.code)).slice(0,2),hb=$('#hint');
  hb.onclick=()=>{hinted=!hinted;for(const c in paths)paths[c].classList.toggle('dim',hinted&&c!==q.code&&!others.includes(c));
    $('#res').textContent=hinted?'밝게 남은 세 곳 중 하나예요.':ask;hb.textContent=hinted?'힌트 취소 (맞히면 다시 100점)':'힌트 보기 (맞히면 50점)'};
  tapHandler=(px,py,cx,cy)=>{tapHandler=null;const hit=document.elementsFromPoint(cx,cy).find(e=>e.dataset&&e.dataset.code);const code=hit?hit.dataset.code:null;const m=toMap(px,py);
    const ok=code===q.code||(T.small&&Math.hypot(m.x-T.lx,m.y-T.ly)<=14);const pt=ok?(hinted?50:100):0;S.total+=pt;
    clearRegions();paths[q.code].classList.add('right');if(!ok&&code)paths[code].classList.add('wrong');
    showLabels(true,q.code);if(!q.region)answerMark(q.x,q.y,q.name);applyView();
    S.log.push({name:q.name,info:ok?(hinted?'힌트 정답':'정답'):(code?DATA.regions[code].short:'바깥'),pt,q});
    const place=q.region?'초록색으로 칠한 곳이에요.':`${q.name}은(는) ${T.name}에 있어요.`;
    panel.innerHTML=head()+title+`<p class="result"><strong class="${ok?'ok':'no'}">${ok?`정답이에요! +${pt}점`:'다음엔 맞힐 수 있어요'}</strong><br>${place}</p>`+nextBtn();bindNext()}}

function cityRound(){const q=S.q[S.i],T=DATA.regions[q.code];let hinted=false;
  const title=`<h2 class="ask">${q.name}</h2>`;
  panel.innerHTML=head()+title+`<p class="result" id="res">시·군 지도에서 이 도시를 찾아 눌러 보세요. 확대할 수 있어요.</p><button class="ghost" id="hint">힌트 보기 (맞히면 50점)</button>`;
  const ask=$('#res').textContent,hb=$('#hint');
  hb.onclick=()=>{hinted=!hinted;DATA.munis.forEach((m,i)=>muPaths[i].classList.toggle('dim',hinted&&m.p!==q.code));hinted?zoomBox(...T.box):fitLand();
    $('#res').textContent=hinted?`${T.name}에 있어요. 밝은 곳에서 찾아보세요.`:ask;hb.textContent=hinted?'힌트 취소 (맞히면 다시 100점)':'힌트 보기 (맞히면 50점)'};
  tapHandler=(px,py,cx,cy)=>{tapHandler=null;const hit=document.elementsFromPoint(cx,cy).find(e=>e.dataset&&e.dataset.mu!=null);const i=hit?+hit.dataset.mu:null;const m=toMap(px,py);
    const ok=i===q.mu||Math.hypot(m.x-q.x,m.y-q.y)<=6;const pt=ok?(hinted?50:100):0;S.total+=pt;
    clearRegions();muPaths[q.mu].classList.add('right');const keep=[q.mu];if(!ok&&i!=null){muPaths[i].classList.add('wrong');keep.push(i)}
    const bx=[...T.box];if(!ok){bx[0]=Math.min(bx[0],m.x);bx[1]=Math.min(bx[1],m.y);bx[2]=Math.max(bx[2],m.x);bx[3]=Math.max(bx[3],m.y)}
    zoomBox(...bx);muLabels(keep);
    S.log.push({name:q.name,info:ok?(hinted?'힌트 정답':'정답'):(i!=null?DATA.munis[i].s:'바깥'),pt,q});
    const said=i!=null?`누른 곳은 ${DATA.munis[i].n}이에요. `:'';
    panel.innerHTML=head()+title+`<p class="result"><strong class="${ok?'ok':'no'}">${ok?`정답이에요! +${pt}점`:'다음엔 맞힐 수 있어요'}</strong><br>${ok?'':said}${q.name}은(는) ${T.name}의 초록색 자리예요.</p>`+nextBtn();bindNext()}}

const nextBtn=()=>`<button class="go" id="next">${S.i+1<S.n?'다음 문제':'결과 보기'}</button>`;
function bindNext(){const b=$('#next');b.onclick=()=>{S.i++;S.i<S.n?nextRound():finish()};b.focus({preventScroll:true})}

function grade(s,n){const t=s/n*10;return t>=850?'대한민국 지도 박사':t>=600?'길눈 밝은 탐험가':t>=300?'쑥쑥 크는 탐험가':'이제 막 떠난 탐험가'}
function finish(){tapHandler=null;clearMarks();clearRegions();resetView();const n=S.n,old=best(S.mode,n);if(S.total>old)saveBest(S.mode,n,S.total);
  if(S.mode==='region'){showLabels(true);S.log.forEach(l=>paths[l.q.code].classList.add(l.pt?'right':'wrong'))}
  else{showLabels(false);S.log.forEach(l=>{muPaths[l.q.mu].classList.add(l.pt?'right':'wrong');answerMark(l.q.x,l.q.y,l.name,true)})}
  applyView();const mode=S.mode,total=S.total,g=grade(total,n);
  panel.innerHTML=`<div class="top"><span>${MODES[mode].t} 결과</span><span>${total>old?'새 최고 기록':'최고 '+old+'점'}</span></div>
  <div class="total">${total}<small> / ${n*100}점</small></div><p><strong>${g}</strong></p>
  <div class="row"><button class="go" id="again" style="flex:2 1 auto">다시 하기</button><button class="ghost" id="homeb">다른 놀이 고르기</button></div>
  <button class="ghost" id="copy">결과 복사</button>
  <ol id="log">${S.log.map(l=>`<li><span>${l.name}</span><span>${l.info}</span><span>${l.pt}</span></li>`).join('')}</ol><p class="src">행정구역은 2026년 11월 기준으로 반영했습니다. 경계는 통계청 SGIS 2018 자료(공공누리 제1유형)에 군위군 대구 편입과 전남광주통합특별시 출범을 더했고, 주변 지형은 Natural Earth입니다.</p>`;
  $('#again').onclick=()=>start(mode);$('#homeb').onclick=home;
  $('#copy').onclick=async e=>{const b=e.target;try{await navigator.clipboard.writeText(`콕! 대한민국 지도 ${MODES[mode].t}: ${total}/${n*100}점, ${g}`);b.textContent='복사했어요'}catch{b.textContent=`${total}/${n*100}점, ${g}`}};panel.scrollTop=0;fitLand()}
panel.addEventListener('click',e=>{if(e.target.id==='quit'){$('#alert').hidden=false;$('#stay').focus()}if(e.target.id==='info'){$('#about').hidden=false;$('#about-close').focus()}});
$('#about-close').onclick=()=>{$('#about').hidden=true};
$('#stay').onclick=()=>{$('#alert').hidden=true};
$('#leave').onclick=()=>{$('#alert').hidden=true;home()};
window.__kok={start,get S(){return S}};
measure();home();
</script>
